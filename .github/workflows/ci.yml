name: synthetic-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standard-library synthetic tests
        run: python3 -B -m unittest discover -s tests -q
      - name: Public allowlist and ZIP
        run: python3 -B scripts/build_release.py
      # Native transaction/config tests require an existing Hermes installation.
      # Hosted CI skips those explicitly; it never installs Hermes or accesses accounts.
